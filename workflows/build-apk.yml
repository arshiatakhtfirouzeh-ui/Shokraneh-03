name: Build Android APK

# Run it by hand: GitHub → Actions → "Build Android APK" → Run workflow.
# Pushing a tag such as v1.0.0 also publishes the APK as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.14"
      PYTHONUTF8: "1"
      FLET_CLI_LOG_FORMAT: github
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Download the Vazirmatn font (optional, makes Persian text prettier)
        run: python3 tools/get_fonts.py || echo "font download failed - the app will use the system font"

      - name: Build APK
        run: uv run flet build apk --yes --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: shokraneh-apk
          path: build/apk
          if-no-files-found: error

      - name: Publish a Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
